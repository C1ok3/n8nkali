services:

  postgres:
    image: postgres:16-alpine
    container_name: n8nkali-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8nkali}
      POSTGRES_USER: ${POSTGRES_USER:-n8nkali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./crm/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./crm/init.sql:/docker-entrypoint-initdb.d/02_init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8nkali} -d ${POSTGRES_DB:-n8nkali}"]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: n8nkali-scraper
    restart: unless-stopped
    environment:
      SCRAPER_PORT: ${SCRAPER_PORT:-5000}
      ASSETS_DIR: /app/assets
    volumes:
      - assets_data:/app/assets
    ports:
      - "${SCRAPER_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: n8nkali-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8080}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-n8nkali}
      POSTGRES_USER: ${POSTGRES_USER:-n8nkali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SCRAPER_SERVICE_URL: http://scraper:5000
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  assets_data:

networks:
  default:
    name: n8nkali-net
